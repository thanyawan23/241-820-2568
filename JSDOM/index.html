<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div></div>
<body>
    <h1>งานอดิเรก</h1>
    <div id="content"></div>
    <!-- สร้าง checkbox สำหรับงานอดิเรก                                
     <u1>
        <li>อ่านหนังสือ</li>
        <li>ว่ายน้ำ</li>
        <li>เล่นเกม</li>
     </u1>
    -->
    <input type="checkbox" name="hobby" value="reading"> อ่านหนังสือ
    <input type="checkbox" name="hobby" value="swimming"> ว่ายน้ำ
    <input type="checkbox" name="hobby" value="gaming"> เล่นเกม
    <button onclick="SubmitHobby()">Submit</button>
    <script>
        function SubmitHobby() {
            //เลือก ไป checkbox ที่มี name เป็น hobby ทั้งหมด
            let hobbies = document.querySelectorAll("input[name='hobby']");
            let consoleHTML = "<ul>";
            //เอาค่าที่เลือก ออกมา
            for (let i = 0; i < hobbies.length; i++) {
                if(hobbies[i].checked) {
                    consoleHTML += "<li>" + hobbies[i].value + "</li>";
                }
            }
            //วนค่าที่เลือก มาแสดงในรูปแบบ u1 li ใส่ html
            consoleHTML += "</ul>";

            //ใส่ html ใน div id content
            let contentDiv = document.getElementById("content");
            contentDiv.innerHTML = consoleHTML;
        }
    </script>
</body>
</html>
